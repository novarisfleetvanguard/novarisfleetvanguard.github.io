<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title desc">
 <title id="title">Novaris Vanguard sword and star pistol</title>
 <desc id="desc">A complete curved ivory sword with a wrapped hilt stands beside a complete cyan-powered space pistol, within a gold celestial orbit.</desc>
