  <linearGradient id="core" x1="372" y1="304" x2="513" y2="325" gradientUnits="userSpaceOnUse"><stop stop-color="#2b768b"/><stop offset=".38" stop-color="#aefff1"/><stop offset="1" stop-color="#69d8e6"/></linearGradient>
